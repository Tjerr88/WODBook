tight and your gluts pinched\n- Do as many sets as comfortable in 5 minutes.\nThen...\nB. Double KB Front Squats (DFSQ)\n- Set your timer for 10 minutes\n- Do sets of 1 to 3 reps\n- Rest as needed between sets", "full": "I’m excited about today.\nToday, we start our double KB training!\n*PUMPS FIST*\nIf you’ve never done it, don’t worry - you’re going to\nlove it.\nIt’s like single KB training on steroids.\nWOD #72:\nA.Double KB Rack Hold\n- Set your timer for 5 minutes\n- Clean the KBs into the rack (just like a single KB Clean\nbut with a wider stance\n- Hold them there for 6 to 10 seconds - keeping your\nabs tight and your gluts pinched\n- Do as many sets as comfortable in 5 minutes.\nThen...\nB. Double KB Front Squats (DFSQ)\n- Set your timer for 10 minutes\n- Do sets of 1 to 3 reps\n- Rest as needed between sets\nTECHNIQUE TIP:\nHere’s a video with some quick pointers on how to do the\nDFSQ:\nhttp://www.kettlebellsecrets.com/videos/dfsq.html\nEnjoy!\nGeoff", "minutes": 0}, {"main": "A. 1H Swings\nB. Snatches\n- Warm up with 1H Swings for 5 minutes.\n- Then set your timer for 10 minutes\n- Practice your Snatch for 2 to 3 reps at a time (working\non speed of movement)\n- Perform as a many rep/sets as comfortable\n- Rest as and when necessary\n- Keep your reps fast and crisp!", "full": "You’ll find today a sharp contrast to yesterday’s workout.\nWOD #73:\nA. 1H Swings\nB. Snatches\n- Warm up with 1H Swings for 5 minutes.\n- Then set your timer for 10 minutes\n- Practice your Snatch for 2 to 3 reps at a time (working\non speed of movement)\n- Perform as a many rep/sets as comfortable\n- Rest as and when necessary\n- Keep your reps fast and crisp!\nEnjoy!\nGeoff", "minutes": 10}, {"main": "A.Double KB Rack Hold\n- Set your timer for 5 minutes\n- Clean the KBs into the rack (just like a single KB Clean\nbut with a wider stance\n- Hold them there for 6 to 10 seconds - keeping your\nabs tight and your gluts pinched\n- Do as many sets as comfortable in 5 minutes.\nThen...\nB. Double KB Front Squats (DFSQ)\n- Set your timer for 10 minutes\n- Do sets of 1 to 3 reps\n- Rest as needed between sets", "full": "Today’s a repeat of #72.\nThe double KB work requires more practice than the\nsingles in my experience.\nWhy?\nMore things can go wrong.\nSo we want out technique dialed in.\nSo today’s goal is to do the same thing we did in #72,\nonly we’re going for higher quality.\nWe’re attempting to make everything feel EASIER.\nWOD #74:\nA.Double KB Rack Hold\n- Set your timer for 5 minutes\n- Clean the KBs into the rack (just like a single KB Clean\nbut with a wider stance\n- Hold them there for 6 to 10 seconds - keeping your\nabs tight and your gluts pinched\n- Do as many sets as comfortable in 5 minutes.\nThen...\nB. Double KB Front Squats (DFSQ)\n- Set your timer for 10 minutes\n- Do sets of 1 to 3 reps\n- Rest as needed between sets\nTECHNIQUE TIP:\nHere’s that video again with some quick pointers on how to\ndo the DFSQ:\nhttp://www.kettlebellsecrets.com/videos/dfsq.html\n\nEnjoy!\nGeoff", "minutes": 0}, {"main": "A. 1H Swings\nB. Snatches\n- Warm up with 1H Swings for 5 minutes.\n- Then set your timer for 10 minutes\n- Practice your Snatch for 6 to 10 reps at a time\n- Perform as a many rep/sets as comfortable\n- Rest as and when necessary\n- Keep your reps fast and crisp!\nHasta la vista...\nGeoff", "full": "More contrasting (and arguably harder - at least metabolically) work today.\nWOD #75:\nA. 1H Swings\nB. Snatches\n- Warm up with 1H Swings for 5 minutes.\n- Then set your timer for 10 minutes\n- Practice your Snatch for 6 to 10 reps at a time\n- Perform as a many rep/sets as comfortable\n- Rest as and when necessary\n- Keep your reps fast and crisp!\nHasta la vista...\nGeoff", "minutes": 10}, {"main": "A. Double KB Front Squats (DFSQ)\n- Set your timer for 7 minutes\n- Do sets of 1 to 3 reps\n- Rest as needed between sets\nB. Double Military Press (DMP)\n- Set your timer for 7 minutes\n- Do sets of 1 to 3 reps\n- Rest as needed between sets", "full": "Hey,\nBack to our doubles work today...\nToday we’re going to add in the DMP - The Double Military\nPress.\nWOD #76:\nA. Double KB Front Squats (DFSQ)\n- Set your timer for 7 minutes\n- Do sets of 1 to 3 reps\n- Rest as needed between sets\nB. Double Military Press (DMP)\n- Set your timer for 7 minutes\n- Do sets of 1 to 3 reps\n- Rest as needed between sets\nTECHNIQUE TIP:\nHere’s a video with some quick pointers on how to do the\nDMP:\nhttp://www.kettlebellsecrets.com/videos/dmp.html\nEnjoy!\nGeoff", "minutes": 7}, {"main": "A. 1H Swings\nB. Snatches\n- Warm up with 1H Swings for 5 minutes.\n- Then set your timer for 10 minutes\n- Practice your Snatch for 2 to 3 reps at a time (working\non speed of movement)\n- Perform as a many rep/sets as comfortable\n- Rest as and when necessary\n- Keep your reps fast and crisp!\nTalk soon.\nGeoff", "full": "Fast and light today, my friend.\nMake your Snatches today as crisp and explosive as\npossible.\nWOD #77:\nA. 1H Swings\nB. Snatches\n- Warm up with 1H Swings for 5 minutes.\n- Then set your timer for 10 minutes\n- Practice your Snatch for 2 to 3 reps at a time (working\non speed of movement)\n- Perform as a many rep/sets as comfortable\n- Rest as and when necessary\n- Keep your reps fast and crisp!\nTalk soon.\nGeoff", "minutes": 10}, {"main": "A1. Get Up                       x 2,2\nA2. Single Leg DL           x 3,3\n- Set your timer for 15 minutes\n- Alternate between A1 and A2\n- Use a medium to medium-heavy kettlebell.\n- Perform as a many rounds as comfortable\n- Rest as and when necessary\nTalk soon.\nGeoff", "full": "More contrasts today, prepping for WOD #80...\nWOD #78:\nA1. Get Up                       x 2,2\nA2. Single Leg DL           x 3,3\n- Set your timer for 15 minutes\n- Alternate between A1 and A2\n- Use a medium to medium-heavy kettlebell.\n- Perform as a many rounds as comfortable\n- Rest as and when necessary\nTalk soon.\nGeoff", "minutes": 15}, {"main": "I have a surprise for you today.\nTake today off from all KB work and spend 15 minutes\nstretching, or doing mobility work, or Original Strength\nRESETs.\nWhy?\nTo prepare for tomorrow’s WOD, which will be the\nhardest one yet.\n(Aren’t you excited?)\n:-)\nTalk to you tomorrow.\nGeoff", "full": "I have a surprise for you today.\nTake today off from all KB work and spend 15 minutes\nstretching, or doing mobility work, or Original Strength\nRESETs.\nWhy?\nTo prepare for tomorrow’s WOD, which will be the\nhardest one yet.\n(Aren’t you excited?)\n:-)\nTalk to you tomorrow.\nGeoff", "minutes": 15}, {"main": "Remember on WOD #s 20,40, and 60 we did our\nSwing Tests?\nToday, we’re venturing into “big boy/girl” territory -\nThe 5 Minute Snatch Test.\nSo...\nSpend about 5 minutes prepping with 1H Swings or\nwhatever you feel like you need, then -\nSet your timer for 5 minutes.\nDo as many total Snatches as possible.\nYou may set the KB down as many times as necessary\nin the 5 minutes.\nRecord your results.\nTEST TIP:\nUse either 5/5 or 10/10 before setting the KB down.\n(Where 5/5 = 5 left, 5 right or vice versa.)\nIf you’re going to use 5/5, try to go 5/5/5/5 before\nsetting it down.\nIf you’re up for it - send me your results.\nRemember to include your KB size too.", "full": "Remember on WOD #s 20,40, and 60 we did our\nSwing Tests?\nToday, we’re venturing into “big boy/girl” territory -\nThe 5 Minute Snatch Test.\nSo...\nSpend about 5 minutes prepping with 1H Swings or\nwhatever you feel like you need, then -\nSet your timer for 5 minutes.\nDo as many total Snatches as possible.\nYou may set the KB down as many times as necessary\nin the 5 minutes.\nRecord your results.\nTEST TIP:\nUse either 5/5 or 10/10 before setting the KB down.\n(Where 5/5 = 5 left, 5 right or vice versa.)\nIf you’re going to use 5/5, try to go 5/5/5/5 before\nsetting it down.\nIf you’re up for it - send me your results.\nRemember to include your KB size too.\nENJOY!\nGeoff", "minutes": 5}, {"main": "A1. Get Up                       x 2,2\nA2. Single Leg DL           x 3,3\nA3. Goblet Squat             x 5\n- Set your timer for 15 minutes\n- Perform A1, A2 and A3 as a strength circuit\n- Use a medium kettlebell\n- Perform as a many rounds as comfortable\n- Rest as and when necessary\nTalk soon.\nGeoff", "full": "Recovery day after WOD #80, Amigo...\n(Hope you surpassed your expectations.)\nWOD #81:\nA1. Get Up                       x 2,2\nA2. Single Leg DL           x 3,3\nA3. Goblet Squat             x 5\n- Set your timer for 15 minutes\n- Perform A1, A2 and A3 as a strength circuit\n- Use a medium kettlebell\n- Perform as a many rounds as comfortable\n- Rest as and when necessary\nTalk soon.\nGeoff", "minutes": 15}, {"main": "A. Hand-2-Hand Swings\n- Set your timer for 15 minutes\n- Use a light KB and focus on \"popping\" your hips\nmaking the KB feel light and \"snappy\"\n- Perform as a many rep/sets as comfortable\n- Rest as and when necessary\n- Keep your reps fast and crisp!\nTalk soon.\nGeoff", "full": "Still a recovery day today.\nA Snatch Test can (and will) take it out of you.\nWOD #82:\nA. Hand-2-Hand Swings\n- Set your timer for 15 minutes\n- Use a light KB and focus on \"popping\" your hips\nmaking the KB feel light and \"snappy\"\n- Perform as a many rep/sets as comfortable\n- Rest as and when necessary\n- Keep your reps fast and crisp!\nTalk soon.\nGeoff", "minutes": 15}, {"main": "A1. Get Up                     x 1,1\nA2. Press, L,R               x 5,5\nA3. Double Press          x 5\n- Set your timer for 15 minutes\n- Perform A1 through A3 as a \"strength circuit\"\n- Use medium sized KBs\n- Perform as a many rep/sets as comfortable\n- Rest as and when necessary\nTalk soon.\nGeoff", "full": "Time to get back to \"the grind\" today.\nWOD #83:\nA1. Get Up                     x 1,1\nA2. Press, L,R               x 5,5\nA3. Double Press          x 5\n- Set your timer for 15 minutes\n- Perform A1 through A3 as a \"strength circuit\"\n- Use medium sized KBs\n- Perform as a many rep/sets as comfortable\n- Rest as and when necessary\nTalk soon.\nGeoff", "minutes": 15}, {"main": "A1. 1H Swing                x 10,10\nA2. Snatch                    x 5,5\n- Set your timer for 15 minutes\n- Alternate between A1 and A2\n- Use a Heavy KB for Swings, and a medium sized\nKB for Snatches\n- Perform as a many sets as possible, keeping your\nreps crisp and explosive\n- Rest as and when necessary\nTalk soon.\nGeoff", "full": "Snatch practice today.\nWOD #84:\nA1. 1H Swing                x 10,10\nA2. Snatch                    x 5,5\n- Set your timer for 15 minutes\n- Alternate between A1 and A2\n- Use a Heavy KB for Swings, and a medium sized\nKB for Snatches\n- Perform as a many sets as possible, keeping your\nreps crisp and explosive\n- Rest as and when necessary\nTalk soon.\nGeoff", "minutes": 15}, {"main": "A1. Double Press                     x 3-5\nA2. Double Front Squat           x 5\n- Set your timer for 15 minutes\n- Alternate between A1 and A2.\n- Use medium to medium-heavy KBs\n- Perform as a many rep/sets as comfortable\n- Rest as and when necessary\nTalk soon.\nGeoff", "full": "Hey!\nFull on Double KB grind work today.\nPace yourself. Fatigue will sneak up on you.\nWOD #85:\nA1. Double Press                     x 3-5\nA2. Double Front Squat           x 5\n- Set your timer for 15 minutes\n- Alternate between A1 and A2.\n- Use medium to medium-heavy KBs\n- Perform as a many rep/sets as comfortable\n- Rest as and when necessary\nTalk soon.\nGeoff", "minutes": 15}, {"main": "A1. Get Up                       x 1,1\nA2. Single Leg DL           x 5,5\nA3. Goblet Squat             x 10\n- Set your timer for 15 minutes\n- Perform A1, A2 and A3 as a strength circuit\n- Use a heavy-ish kettlebell\n- Perform as a many rounds as possible, using\nperfect form\n- Rest as and when necessary\nTalk soon.\nGeoff", "full": "Yo!\nRamping it back up here...\nWOD #86:\nA1. Get Up                       x 1,1\nA2. Single Leg DL           x 5,5\nA3. Goblet Squat             x 10\n- Set your timer for 15 minutes\n- Perform A1, A2 and A3 as a strength circuit\n- Use a heavy-ish kettlebell\n- Perform as a many rounds as possible, using\nperfect form\n- Rest as and when necessary\nTalk soon.\nGeoff", "minutes": 15}, {"main": "A. H2H Swings - 5 minutes\nB. Practice: Double Swings - 10 minutes\n- Set your timer for 15 minutes\n- For \"A\" use a light KB and focus on \"popping\" your hips\nmaking the KB feel light and \"snappy\"\n- Perform as a many rep/sets as comfortable\n- Rest as and when necessary\n- Use the following video for Double Swing Technique:\n=> http://kettlebellsecrets.com/videos/dsw.html\n\nTalk soon.\nGeoff\nPS - Yup - that is an old video - c. 2010 or so.\nStill valuable info though. I'll get around to updating\nit one day...", "full": "Que pasa?\nLet's make today a great one!\nSome technique work today.\nWOD #87:\nA. H2H Swings - 5 minutes\nB. Practice: Double Swings - 10 minutes\n- Set your timer for 15 minutes\n- For \"A\" use a light KB and focus on \"popping\" your hips\nmaking the KB feel light and \"snappy\"\n- Perform as a many rep/sets as comfortable\n- Rest as and when necessary\n- Use the following video for Double Swing Technique:\n=> http://kettlebellsecrets.com/videos/dsw.html\n\nTalk soon.\nGeoff\nPS - Yup - that is an old video - c. 2010 or so.\nStill valuable info though. I'll get around to updating\nit one day...", "minutes": 15}, {"main": "A1. Get Up                     x 1,1\nA2. Press, L,R               x 3-5, 3-5\nA3. Double Press          x 3-5\n- Set your timer for 15 minutes\n- Use medium-heavy sized KBs\n- Perform A1 through A3 as a \"strength circuit\"\n- Use 3 to 5 reps per set for A2 and A3, depending\non your fatigue levels.\n- Perform as a many rep/sets as comfortable\n- Rest as and when necessary\nTalk soon.\nGeoff", "full": "More \"grinding\" today...\nWOD #88:\nA1. Get Up                     x 1,1\nA2. Press, L,R               x 3-5, 3-5\nA3. Double Press          x 3-5\n- Set your timer for 15 minutes\n- Use medium-heavy sized KBs\n- Perform A1 through A3 as a \"strength circuit\"\n- Use 3 to 5 reps per set for A2 and A3, depending\non your fatigue levels.\n- Perform as a many rep/sets as comfortable\n- Rest as and when necessary\nTalk soon.\nGeoff", "minutes": 15}, {"main": "Here ya go -\nA. Snatch  x 5,5\n-Set timer for 15 minutes\n-Use a moderately heavy KB\n-Make EVERY REP Explosive!  \u003c— See that “!”? Makes the word\n“Explosive” more emphatic. ;-)", "full": "Yo!\nBack at the Snatches today.\nWOD #89:\nHere ya go -\nA. Snatch  x 5,5\n-Set timer for 15 minutes\n-Use a moderately heavy KB\n-Make EVERY REP Explosive!  \u003c— See that “!”? Makes the word\n“Explosive” more emphatic. ;-)\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A1. Double Press x 2-3\nA2. Double Front Squat x 3\n-Set timer for 15 minutes\n-Use heavier KBs\n-Rest as needed between sets\n-Make each rep crisp", "full": "Heavy day, today.\nWOD #90:\nA1. Double Press x 2-3\nA2. Double Front Squat x 3\n-Set timer for 15 minutes\n-Use heavier KBs\n-Rest as needed between sets\n-Make each rep crisp\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A1. 2H Swing x 10\nA2. 1H Swing x 5,5\nA3. Double Swing x 5\n-Set timer for 15 minutes\n-Use heavier KBs\n-Rest as needed between sets\n-Make each rep EXPLOSIVE!  \u003c— ALL CAPS and “!” =\nREALLY emphatic!", "full": "Swinging into action today!\nWOD #91:\nA1. 2H Swing x 10\nA2. 1H Swing x 5,5\nA3. Double Swing x 5\n-Set timer for 15 minutes\n-Use heavier KBs\n-Rest as needed between sets\n-Make each rep EXPLOSIVE!  \u003c— ALL CAPS and “!” =\nREALLY emphatic!\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A1. Get Up x 1,1\nA2. Single Press x 3,3\nA3. Double Press x 3\n-Set timer for 15 minutes\n-Use heavier KBs\n-Rest as needed between sets", "full": "Hola!\nSlowing things down a bit today...\nWOD #92:\nA1. Get Up x 1,1\nA2. Single Press x 3,3\nA3. Double Press x 3\n-Set timer for 15 minutes\n-Use heavier KBs\n-Rest as needed between sets\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A1. 1H Swing x 5,5\nA2. Snatch x 5,5\n-Set timer for 15 minutes\n-Use the same sized KB for both exercises - and make\nit somewhat heavy\n-Rest as needed between sets", "full": "More explosiveness today.\n(Or is that “explosivity?” I dunno...)\nWOD #93:\nA1. 1H Swing x 5,5\nA2. Snatch x 5,5\n-Set timer for 15 minutes\n-Use the same sized KB for both exercises - and make\nit somewhat heavy\n-Rest as needed between sets\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A1. Double Press x 3-5\nA2. Double Front Squat x 3-5\n-Set timer for 15 minutes\n-Use heavy KBs\n-Rest as needed between sets", "full": "Contrasting our explosive workout yesterday with\nsomething heavy and slow today.\nContrasts... It’s how the best progress is made.\nWOD #94:\nA1. Double Press x 3-5\nA2. Double Front Squat x 3-5\n-Set timer for 15 minutes\n-Use heavy KBs\n-Rest as needed between sets\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A. Snatch x 10,10\n-Set timer for 15 minutes\n-Use a KB that allows you to get 10 reps on each hand\npretty easily\n-Rest as needed between sets\n-Keep those reps EXPLOSIVE!", "full": "Time to get the Snatch on today!\nWOD #95:\nA. Snatch x 10,10\n-Set timer for 15 minutes\n-Use a KB that allows you to get 10 reps on each hand\npretty easily\n-Rest as needed between sets\n-Keep those reps EXPLOSIVE!\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A1. 2H Swing x 10\nA2. 1H Swing x 5,5\nA3. Double Swing x 5\n-Set timer for 15 minutes\n-Use heavier KBs\n-Rest as needed between sets\n-Make each rep EXPLOSIVE!", "full": "Repeat WOD #91 today, , with an extra\nemphasis on your Double Swings.\nPut all your effort into those, ok?\nWOD #96:\nA1. 2H Swing x 10\nA2. 1H Swing x 5,5\nA3. Double Swing x 5\n-Set timer for 15 minutes\n-Use heavier KBs\n-Rest as needed between sets\n-Make each rep EXPLOSIVE!\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A1. Get Up x 1,1\nA2. Single Press x 2,2\nA3. Double Press x 2-3\n-Set timer for 15 minutes\n-Use heavier KBs\n-Rest as needed between sets", "full": "Heavy today, my friend.\nWOD #97:\nA1. Get Up x 1,1\nA2. Single Press x 2,2\nA3. Double Press x 2-3\n-Set timer for 15 minutes\n-Use heavier KBs\n-Rest as needed between sets\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A1. 1H Swing x 5,5\nA2. Snatch x 5,5\n-Set timer for 15 minutes\n-Use the same sized KB for both exercises - Medium.\n-Rest as needed between sets", "full": "Make today fast, lighter, and EXPLOSIVE!\nWOD #98:\nA1. 1H Swing x 5,5\nA2. Snatch x 5,5\n-Set timer for 15 minutes\n-Use the same sized KB for both exercises - Medium.\n-Rest as needed between sets\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A1. Double Press x 2\nA2. Double Front Squat x 2\n-Set timer for 15 minutes\n-Use heavy KBs\n-Rest as needed between sets", "full": "Hey There,\nBack to heavy today, but keep the volume very low.\nAnd rest a lot between sets.\n\nMake sure you feel fresh when you’re done.\n(You’ll see why tomorrow...)\nWOD #99:\nA1. Double Press x 2\nA2. Double Front Squat x 2\n-Set timer for 15 minutes\n-Use heavy KBs\n-Rest as needed between sets\nEnjoy!\nGeoff", "minutes": 15}, {"main": "WHOA!\nBIG DAY TODAY!!\nThis, is your 100th W.O.D.!\nBOOM!\nYEAH - BIG CONGRATS ON MAKING IT THIS\nFAR!\nYou should be feeling very proud of yourself!\nAnd to celebrate?\nA Snatch Test of course!\n(Of course! What else?)\nSo, let’s get to it.\nThe 5 Minute Snatch Test.\nSo...\nSpend about 5 minutes prepping with 1H Swings or\nwhatever you feel like you need, then -\nSet your timer for 5 minutes.\nDo as many total Snatches as possible.\nYou may set the KB down as many times as necessary\nin the 5 minutes.\nRecord your results.\nTEST TIP:\nUse either 5/5 or 10/10 before setting the KB down.\n\n(Where 5/5 = 5 left, 5 right or vice versa.)\nIf you’re going to use 5/5, try to go 5/5/5/5 before\nsetting it down.\nIf you’re up for it - send me your results.\nRemember to include your KB size too.\nNow, compare this to WOD #80.\nHow’d you do?\nMake note of your increase in your training journal\nif you’re keeping one.", "full": "WHOA!\nBIG DAY TODAY!!\nThis, is your 100th W.O.D.!\nBOOM!\nYEAH - BIG CONGRATS ON MAKING IT THIS\nFAR!\nYou should be feeling very proud of yourself!\nAnd to celebrate?\nA Snatch Test of course!\n(Of course! What else?)\nSo, let’s get to it.\nThe 5 Minute Snatch Test.\nSo...\nSpend about 5 minutes prepping with 1H Swings or\nwhatever you feel like you need, then -\nSet your timer for 5 minutes.\nDo as many total Snatches as possible.\nYou may set the KB down as many times as necessary\nin the 5 minutes.\nRecord your results.\nTEST TIP:\nUse either 5/5 or 10/10 before setting the KB down.\n\n(Where 5/5 = 5 left, 5 right or vice versa.)\nIf you’re going to use 5/5, try to go 5/5/5/5 before\nsetting it down.\nIf you’re up for it - send me your results.\nRemember to include your KB size too.\nNow, compare this to WOD #80.\nHow’d you do?\nMake note of your increase in your training journal\nif you’re keeping one.\nENJOY!\nGeoff\nPS - Once today's Snatch Test is over, go out and\ncelebrate.\nDo something nice for yourself.\nLike always - I don't recommend making it food based\nthough.\nMaybe a new DVD or piece of clothing or - well,\nyou'll figure it out.\nPPS - Speaking of “something nice,” here’s a little gift\nfor you for making it this far. Think it’ll help you out.", "minutes": 5}, {"main": "A1. Segmental Roll      x 3 each quadrant\nA2. Get Up                    x 2,2\nA3. SLDL                       x 3,3\n- Set timer for 15 minutes\n- Use moderate KBs\n- Be methodical\n- Rest as needed between sets", "full": "Hey!\nSlowing things back down here - start of another\n4 week cycle...\nWOD #101:\nA1. Segmental Roll      x 3 each quadrant\nA2. Get Up                    x 2,2\nA3. SLDL                       x 3,3\n- Set timer for 15 minutes\n- Use moderate KBs\n- Be methodical\n- Rest as needed between sets\n\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A. Double Clean + Press\n- Set timer for 15 n": "Hey, Hey, Hey!\nW.O.D. 120 DAY TODAY!!\nI hope you're loving your results so far.\nLet's get into today's workout, shall we?\nThe 5 Minute Snatch Test.\n\nSpend about 5 minutes prepping with 1H Swings or\nwhatever you feel like you need, then -\nSet your timer for 5 minutes.\nDo as many total Snatches as possible.\nYou may set the KB down as many times as necessary\nin the 5 minutes.\nRecord your results.\nTEST TIP:\nIn case you haven't used this in the past, here's a\ntried and tested pair of methods often used to crush\nthis thing:\nUse either 5/5 or 10/10 before setting the KB down.\n(Where 5/5 = 5 left, 5 right or vice versa.)\nIf you’re going to use 5/5, try to go 5/5/5/5 before\nsetting it down.\nIf you’re up for it - send me your results.\nRemember to include your KB size too.\nNow, compare this to WOD #100.\n\nHow’d you do?\nMake note of your increase in your training journal.\n(You are keeping one, right??)", "full": "Hey, Hey, Hey!\nW.O.D. 120 DAY TODAY!!\nI hope you're loving your results so far.\nLet's get into today's workout, shall we?\nThe 5 Minute Snatch Test.\n\nSpend about 5 minutes prepping with 1H Swings or\nwhatever you feel like you need, then -\nSet your timer for 5 minutes.\nDo as many total Snatches as possible.\nYou may set the KB down as many times as necessary\nin the 5 minutes.\nRecord your results.\nTEST TIP:\nIn case you haven't used this in the past, here's a\ntried and tested pair of methods often used to crush\nthis thing:\nUse either 5/5 or 10/10 before setting the KB down.\n(Where 5/5 = 5 left, 5 right or vice versa.)\nIf you’re going to use 5/5, try to go 5/5/5/5 before\nsetting it down.\nIf you’re up for it - send me your results.\nRemember to include your KB size too.\nNow, compare this to WOD #100.\n\nHow’d you do?\nMake note of your increase in your training journal.\n(You are keeping one, right??)\nENJOY!\nGeoff\nPS - Once today's Snatch Test is over, go out and\ncelebrate.\nDo something nice for yourself.\nOnce again, sentially 3 hard and\nheavy months, we're going to take it easy.\nSome coaches may prefer a week off altogether.\nI don't.\nI prefer to do something easy and light - to keep\nmoving.\nSo that's what we're going to do this week.\nThe goal is to walk away with barely a sweat each day.\nHere's today's WOD -\nWOD #181:\nUse the same KB you did for the Snatch Test.\nA. 2H Swing\n- Set your timer for 10 minutes\n\n- Perform 50% of the reps you achieved in your\nlast Snatch Test\n- Vary your reps per set BUT STAY AWAY FROM\nFATIGUE!\nEnjoy!\nGeoff", "minutes": 10}, {"main": "Use the same KB you did for the Snatch Test.\nA. 1H Swing\n- Set your timer for 10 minutes\n- Perform 50% of the reps you achieved in your\nlast Snatch Test\n- Like yesterday, vary your reps per set BUT STAY AWAY\nFROM FATIGUE!", "full": "DAY 2 of Active Recovery Week..\nWOD #182:\nUse the same KB you did for the Snatch Test.\nA. 1H Swing\n- Set your timer for 10 minutes\n- Perform 50% of the reps you achieved in your\nlast Snatch Test\n- Like yesterday, vary your reps per set BUT STAY AWAY\nFROM FATIGUE!\nEnjoy!\nGeoff", "minutes": 10}, {"main": "Use the same KB you did for the Snatch Test.\nA. 2H Swing\n- Set your timer for 10 minutes\n- Perform 60% of the reps you achieved in your\nlast Snatch Test\n- Like yesterday, vary your reps per set BUT STAY AWAY\nFROM FATIGUE!", "full": "DAY 3 of Active Recovery Week..\nWOD #183:\nUse the same KB you did for the Snatch Test.\nA. 2H Swing\n- Set your timer for 10 minutes\n- Perform 60% of the reps you achieved in your\nlast Snatch Test\n- Like yesterday, vary your reps per set BUT STAY AWAY\nFROM FATIGUE!\nEnjoy!\nGeoff", "minutes": 10}, {"main": "Use the same KB you did for the Snatch Test.\nA. 1H Swing\n- Set your timer for 10 minutes\n- Perform 60% of the reps you achieved in your\nlast Snatch Test\n- Like yesterday, vary your reps per set BUT STAY AWAY\nFROM FATIGUE!", "full": "DAY 4 of Active Recovery Week..\nWOD #184:\nUse the same KB you did for the Snatch Test.\nA. 1H Swing\n- Set your timer for 10 minutes\n- Perform 60% of the reps you achieved in your\nlast Snatch Test\n- Like yesterday, vary your reps per set BUT STAY AWAY\nFROM FATIGUE!\nEnjoy!\nGeoff", "minutes": 10}, {"main": "Use the same KB you did for the Snatch Test.\nA. 2H Swing OR 1H Swing (Your Choice)\n- Set your timer for 10 minutes\n- Perform 70% of the reps you achieved in your\nlast Snatch Test\n- Like yesterday, vary your reps per set BUT STAY AWAY\nFROM FATIGUE!", "full": "DAY 5 - Last and FINAL Day of Active Recovery Week..\nWOD #185:\nUse the same KB you did for the Snatch Test.\nA. 2H Swing OR 1H Swing (Your Choice)\n- Set your timer for 10 minutes\n- Perform 70% of the reps you achieved in your\nlast Snatch Test\n- Like yesterday, vary your reps per set BUT STAY AWAY\nFROM FATIGUE!\nEnjoy!\nGeoff", "minutes": 10}, {"main": "A1. Get Up x 1,1\nA2. Goblet Squat w/ Pause in bottom x 5\nA3. Single Leg Deadlift x 3,3\n- Set your timer for 15 minutes\n- Perform as a \"strength circuit\"\n- Rest as necessary to keep your quality high", "full": "Hey, hey, hey!\nHope you're feeling great after last week's active recovery\nworkouts.\nFor the rest of this month, we're going to reload our single\nKB work.\nYou'll probably want to grab a heavier kettlebell.\nWOD #186:\nA1. Get Up x 1,1\nA2. Goblet Squat w/ Pause in bottom x 5\nA3. Single Leg Deadlift x 3,3\n- Set your timer for 15 minutes\n- Perform as a \"strength circuit\"\n- Rest as necessary to keep your quality high\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A. Clean + Press, L,R\n- Perform ladders of 1,2,3\n- Set your timer for 15 minutes\n- Rest as necessary between ladder rungs to keep\nyour quality high\nHasta la vista!\nGeoff", "full": "YO!\n\nHarder work today.\nWOD #187:\nA. Clean + Press, L,R\n- Perform ladders of 1,2,3\n- Set your timer for 15 minutes\n- Rest as necessary between ladder rungs to keep\nyour quality high\nHasta la vista!\nGeoff", "minutes": 15}, {"main": "A1. Get Up x 2,2\n tes": 15}, {"main": "A1. Get Up x 1,1\nA2. Goblet Squat w/ Pause in bottom x 3-5\nA3. Single Leg Deadlift x 4,4\n- Set your timer for 15 minutes\n- Perform as a \"strength circuit\"\n- Rest as necessary to keep your quality high", "full": "¡HOLA!\n\nTime once again to get it done.\nWOD #196:\nA1. Get Up x 1,1\nA2. Goblet Squat w/ Pause in bottom x 3-5\nA3. Single Leg Deadlift x 4,4\n- Set your timer for 15 minutes\n- Perform as a \"strength circuit\"\n- Rest as necessary to keep your quality high\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A. Clean + Press, L,R\n- Perform ladders of 1,2,3,4,5\n- Set your timer for 15 minutes\n- Rest as necessary between ladder rungs to keep\nyour quality high\nLaterzzz...\nGeoff", "full": "Even more C+P's today...\nWOD #197:\nA. Clean + Press, L,R\n- Perform ladders of 1,2,3,4,5\n- Set your timer for 15 minutes\n- Rest as necessary between ladder rungs to keep\nyour quality high\nLaterzzz...\nGeoff", "minutes": 15}, {"main": "A1. Get Up x 1,1\nA2. Single Leg Deadlift x 3,3\n- Set your timer for 15 minutes\n- Alternate between A1 and A2\n- Rest as necessary to keep your quality high", "full": "Taking it easy today...\nMake this feel light n' easy, ok?\n\nWOD #198:\nA1. Get Up x 1,1\nA2. Single Leg Deadlift x 3,3\n- Set your timer for 15 minutes\n- Alternate between A1 and A2\n- Rest as necessary to keep your quality high\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A1. Clean + Press, L,R\nA2. Front Squat, L,R\n- Alternate between sets of A1 and A2\n- Perform sets of 2 for both A1 and A2\n- Set your timer for 15 minutes\n- Rest as necessary to keep your quality high", "full": "Once again, take it easy today.\nWe have a big one tomorrow.\nIn the meantime, here's today's...\nWOD #199:\nA1. Clean + Press, L,R\nA2. Front Squat, L,R\n- Alternate between sets of A1 and A2\n- Perform sets of 2 for both A1 and A2\n- Set your timer for 15 minutes\n- Rest as necessary to keep your quality high\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A. 5 Minute Snatch Test\nWrite your numbers here: _______\nNow go treat yourself to something special as a reward for\nall your hard work.\nYou deserve it.\nSee you in KB WOD #201.", "full": "200!!\nCan you believe it??\nBIG CONGRATULATIONS!\nYou do realize you are in the minority, don't you?\nA group of the \"select few\" -\nThose who actually COMMIT to a workout program and as\na result, get the leaner, stronger bodies they say they want.\nMost people are quitters.\nNOT YOU!\nTo celebrate, today we have a 5 minute Snatch Test.\nYou know the routine.\nWOD #200:\nA. 5 Minute Snatch Test\nWrite your numbers here: _______\nNow go treat yourself to something special as a reward for\nall your hard work.\nYou deserve it.\nSee you in KB WOD #201.\n\nEnjoy!\nGeoff", "minutes": 5}, {"main": "Use a medium pair of KBs...\nA1. Double Front Squat (DFSQ) x3\nA2. Double Military Press (DMP) x 3\n- Set your timer for 15 minutes\n- Alternate between A1 and A2\n- Rest as and when necessary, keeping your form crisp", "full": "Hey,\nBack to the grind today...\nDouble grinds actually.\nAnd double ballistics too.\nWe’re going to add doubles back in to our programming.\nWe’ll be mixing doubles and singles.\nWOD #201:\nUse a medium pair of KBs...\nA1. Double Front Squat (DFSQ) x3\nA2. Double Military Press (DMP) x 3\n- Set your timer for 15 minutes\n- Alternate between A1 and A2\n- Rest as and when necessary, keeping your form crisp\nEnjoy!\nGeoff", "minutes": 15}, {"main": "Use a medium-sized KB today...\nA. 2H Swing x 20\n- Set your timer for 15 minutes\n- Do as many sets of 20 as comfortable\n- Rest as and when necessary, keeping your form crisp", "full": "Hey!\nSingles today - A nice contrast to yesterday’s heavy work...\nWOD #202:\nUse a medium-sized KB today...\nA. 2H Swing x 20\n- Set your timer for 15 minutes\n- Do as many sets of 20 as comfortable\n- Rest as and when necessary, keeping your form crisp\nEnjoy!\nGeoff", "minutes": 15}, {"main": "Use a medium-sized pair of KBs today...\nA1. Double Clean (DCL) x 5\nA2. Double Push Press (DPP) x 5\n- Set your timer for 15 minutes\n- Alternate between sets of A1 and A2\n- Rest as and when necessary, keeping your form crisp", "full": "Yo!\nMore doubles today...\nWOD #203:\nUse a medium-sized pair of KBs today...\nA1. Double Clean (DCL) x 5\nA2. Double Push Press (DPP) x 5\n- Set your timer for 15 minutes\n- Alternate between sets of A1 and A2\n- Rest as and when necessary, keeping your form crisp\nEnjoy!\nGeoff", "minutes": 15}, {"main": "Use a medium-sized KB today for resilience...\nA1. Get Up x 1,1\nA2. SLDL x 3,3\n- Set your timer for 15 minutes\n- Alternate between sets of A1 and A2\n- Rest as and when necessary, keeping your form crisp", "full": "Hey, hey, hey!\nAnd back to singles today...\nWOD #204:\nUse a medium-sized KB today for resilience...\nA1. Get Up x 1,1\nA2. SLDL x 3,3\n- Set your timer for 15 minutes\n- Alternate between sets of A1 and A2\n- Rest as and when necessary, keeping your form crisp\nEnjoy!\nGeoff", "minutes": 15}, {"main": "Use whatever pair or pairs of KBs you need to today...\nA. Double Snatch (DSN) x 3-5\nB. Double Swing (DSW) x 6\n- Practice A for 7 minutes (Work on your form here)\n- Then do as many sets of B in 7 minutes as possible\n- Rest as and when necessary, keeping your form crisp", "full": "Some good stuff for you today!\nWOD #205:\nUse whatever pair or pairs of KBs you need to today...\nA. Double Snatch (DSN) x 3-5\nB. Double Swing (DSW) x 6\n- Practice A for 7 minutes (Work on your form here)\n- Then do as many sets of B in 7 minutes as possible\n- Rest as and when necessary, keeping your form crisp\nEnjoy!\nGeoff", "minutes": 7}, {"main": "Use a medium pair of KBs...\nA1. DFSQ x 4\nA2. DMP x 4\nA3. Renegade Rows x 4,4\n- Set your timer for 15 minutes\n- Perform A1, A2, and A3 as a strength circuit\n- Rest as and when necessary, keeping your form crisp", "full": "Hey,\nMore doubles work today...\nWOD #206:\nUse a medium pair of KBs...\nA1. DFSQ x 4\nA2. DMP x 4\nA3. Renegade Rows x 4,4\n- Set your timer for 15 minutes\n- Perform A1, A2, and A3 as a strength circuit\n- Rest as and when necessary, keeping your form crisp\nEnjoy!\nGeoff", "minutes": 15}, {"main": "Use a medium-sized KB today...\nA. 1H Swing x 12,12\n- Set your timer for 15 minutes\n- Do as many sets as comfortable, no rest between hands\n- Rest as and when necessary, keeping your form fast\nand crisp", "full": "Hey!\nMore singles today - A nice contrast to yesterday’s heavy work...\nWOD #207:\nUse a medium-sized KB today...\nA. 1H Swing x 12,12\n- Set your timer for 15 minutes\n- Do as many sets as comfortable, no rest between hands\n- Rest as and when necessary, keeping your form fast\nand crisp\nEnjoy!\nGeoff", "minutes": 15}, {"main": "Use a medium-heavy sized pair of KBs today...\nA1. DCL x 5\nA2. DPP x 5\nA3. DFSQ x 5\n- Set your timer for 15 minutes\n- Perform A1, A2, and A3 as a strength circuit\n- Rest as and when necessary, keeping your form crisp\nHasta la vista!\nGeoff", "full": "¡Que pasa!\nBack to the doubles today...\nWOD #208:\nUse a medium-heavy sized pair of KBs today...\nA1. DCL x 5\nA2. DPP x 5\nA3. DFSQ x 5\n- Set your timer for 15 minutes\n- Perform A1, A2, and A3 as a strength circuit\n- Rest as and when necessary, keeping your form crisp\nHasta la vista!\nGeoff", "minutes": 15}, {"main": "Use a medium-sized KB today for resilience...\nA1. Get Up x 2,2\nA2. SLDL x 4,4\n- Set your timer for 15 minutes\n- Alternate between sets of A1 and A2\n- Rest as and when necessary, keeping your form crisp", "full": "Hey, HEY!\nAnd once again, back to singles today...\n(See how this works? Nice little rhythm we have going\non here...)\nWOD #209:\nUse a medium-sized KB today for resilience...\nA1. Get Up x 2,2\nA2. SLDL x 4,4\n- Set your timer for 15 minutes\n- Alternate between sets of A1 and A2\n- Rest as and when necessary, keeping your form crisp\nEnjoy!\nGeoff", "minutes": 15}, {"main": "Use whatever pair or pairs of KBs you need to today...\nA. Double Snatch (DSN) x 4-6\nB. Double Swing (DSW) x 8\n- Practice A for 7 minutes (Work on your form here)\n- Then do as many sets of B in 7 minutes as possible\n- Rest as and when necessary, keeping your form crisp", "full": "More good stuff for you today!\nWOD #210:\nUse whatever pair or pairs of KBs you need to today...\nA. Double Snatch (DSN) x 4-6\nB. Double Swing (DSW) x 8\n- Practice A for 7 minutes (Work on your form here)\n- Then do as many sets of B in 7 minutes as possible\n- Rest as and when necessary, keeping your form crisp\nEnjoy!\nGeoff", "minutes": 7}, {"main": "Use a medium-heavy pair of KBs...\nA1. DFSQ x 5\nA2. DMP x 5\nA3. Renegade Rows x 5,5\n- Set your timer for 15 minutes\n- Perform A1, A2, and A3 as a strength circuit\n- Rest as and when necessary, keeping your form crisp", "full": "Harder work today...\nWOD #211:\nUse a medium-heavy pair of KBs...\nA1. DFSQ x 5\nA2. DMP x 5\nA3. Renegade Rows x 5,5\n- Set your timer for 15 minutes\n- Perform A1, A2, and A3 as a strength circuit\n- Rest as and when necessary, keeping your form crisp\nEnjoy!\nGeoff", "minutes": 15}, {"main": "Use a medium-sized KB today...\nA. 1H Swing x 15,15\n- Set your timer for 15 minutes\n- Do as many sets as comfortable, no rest between hands\n- Rest as and when necessary, keeping your form fast\nand crisp", "full": "Hey!\nOnce again, more singles today - A nice contrast to yesterday’s\nheavy work...\nWOD #212:\nUse a medium-sized KB today...\nA. 1H Swing x 15,15\n- Set your timer for 15 minutes\n- Do as many sets as comfortable, no rest between hands\n- Rest as and when necessary, keeping your form fast\nand crisp\nEnjoy!\nGeoff", "minutes": 15}, {"main": "Use a medium-heavy sized pair of KBs today...\nA1. DCL x 6\nA2. DPP x 6\nA3. DFSQ x 6\n- Set your timer for 15 minutes\n- Perform A1, A2, and A3 as a strength circuit\n- Rest as and when necessary, keeping your form crisp\nHasta la vista!\nGeoff", "full": "¡Que pasa!\nDoubles.\nNeed I say more?\nWOD #213:\nUse a medium-heavy sized pair of KBs today...\nA1. DCL x 6\nA2. DPP x 6\nA3. DFSQ x 6\n- Set your timer for 15 minutes\n- Perform A1, A2, and A3 as a strength circuit\n- Rest as and when necessary, keeping your form crisp\nHasta la vista!\nGeoff", "minutes": 15}, {"main": "Use a medium-sized KB today for resilience...\nA1. Get Up x 3,3\nA2. SLDL x 6,6\n- Set your timer for 15 minutes\n- Alternate between sets of A1 and A2\n- Rest as and when necessary, keeping your form crisp", "full": "Hey, hey, HEY!\nLet’s jump right in here...\nWOD #214:\nUse a medium-sized KB today for resilience...\nA1. Get Up x 3,3\nA2. SLDL x 6,6\n- Set your timer for 15 minutes\n- Alternate between sets of A1 and A2\n- Rest as and when necessary, keeping your form crisp\nEnjoy!\nGeoff", "minutes": 15}, {"main": "Use whatever pair or pairs of KBs you need to today...\nA. Double Snatch (DSN) x 6-8\nB. Double Swing (DSW) x 10\n- Practice A for 7 minutes (Work on your form here)\n- Then do as many sets of B in 7 minutes as possible\n- Rest as and when necessary, keeping your form crisp", "full": "Let’s get it done today!\nWOD #215:\nUse whatever pair or pairs of KBs you need to today...\nA. Double Snatch (DSN) x 6-8\nB. Double Swing (DSW) x 10\n- Practice A for 7 minutes (Work on your form here)\n- Then do as many sets of B in 7 minutes as possible\n- Rest as and when necessary, keeping your form crisp\nEnjoy!\nGeoff", "minutes": 7}, {"main": "Use a medium-heavy pair of KBs...\nA1. DFSQ x 4\nA2. DMP x 4\n- Set your timer for 15 minutes\n- Alternate between A1 and A2\n- Rest as and when necessary, keeping your form crisp", "full": "Let’s dial it back a little today...\nWOD #216:\nUse a medium-heavy pair of KBs...\nA1. DFSQ x 4\nA2. DMP x 4\n- Set your timer for 15 minutes\n- Alternate between A1 and A2\n- Rest as and when necessary, keeping your form crisp\nEnjoy!\nGeoff", "minutes": 15}, {"main": "Use a medium-sized KB today...\nA. 1H Swing x 10,10\n- Set your timer for 15 minutes\n- Do as many sets as comfortable, no rest between hands\n- Rest as and when necessary, keeping your form fast\nand crisp", "full": "Hey!\nAnd still keeping it light this week after the previous 3 weeks\nof ever-harder work.\nWOD #217:\nUse a medium-sized KB today...\nA. 1H Swing x 10,10\n- Set your timer for 15 minutes\n- Do as many sets as comfortable, no rest between hands\n- Rest as and when necessary, keeping your form fast\nand crisp\nEnjoy!\nGeoff", "minutes": 15}, {"main": "Use a medium-heavy sized pair of KBs today...\nA1. DCL x 7\nA2. DPP x 7\n- Set your timer for 15 minutes\n- Alternate between A1 and A2\n- Rest as and when necessary, keeping your form crisp\nHasta la vista!\nGeoff", "full": "¡Que pasa!\nDoubles.\nNeed I say more?\nWOD #218:\nUse a medium-heavy sized pair of KBs today...\nA1. DCL x 7\nA2. DPP x 7\n- Set your timer for 15 minutes\n- Alternate between A1 and A2\n- Rest as and when necessary, keeping your form crisp\nHasta la vista!\nGeoff", "minutes": 15}, {"main": "Do either 15 minutes of mobility work...\nOR -\nDo the following:\nUse a LIGHT KB today for resilience...\nA1. Get Up x 1,1\nA2. SLDL x 3,3\n- Set your timer for 15 minutes\n- Alternate between sets of A1 and A2\n- Rest as and when necessary, keeping your form crisp", "full": "Yo!\nLet’s dial it back almost all the way today cause tomorrow\nis a hard one, ok?\nYour choice here...\nWOD #219:\nDo either 15 minutes of mobility work...\nOR -\nDo the following:\nUse a LIGHT KB today for resilience...\nA1. Get Up x 1,1\nA2. SLDL x 3,3\n- Set your timer for 15 minutes\n- Alternate between sets of A1 and A2\n- Rest as and when necessary, keeping your form crisp\nEnjoy!\nGeoff", "minutes": 15}, {"main": "Use the pair of KBs you’ve been using on these\ndays for your DSW work.\n(Preferably 2 Snatch Test sized KBs or heavier.)\nSet your timer for 10 MINUTES.\nPerform as many sets of the Double Swing as possible.\nRecord your results here: __________.\nThen go out and treat yourself to something nice.\n(Remember, no food treats. We’re not dogs.)", "full": "TEST DAY , Today!\nThat’s right - We’re going to test your Double Swing.\nHere’s how that’s going to work...\nWOD #220:\nUse the pair of KBs you’ve been using on these\ndays for your DSW work.\n(Preferably 2 Snatch Test sized KBs or heavier.)\nSet your timer for 10 MINUTES.\nPerform as many sets of the Double Swing as possible.\nRecord your results here: __________.\nThen go out and treat yourself to something nice.\n(Remember, no food treats. We’re not dogs.)\nEnjoy!\nGeoff", "minutes": 10}, {"main": "DSW + DCL + DFSQ + DMP\n- Use a pair of KBs you can press 8-10 times, with relative ease\n- Remember, perform ALL your reps for the DSW, then ALL\nyour reps for the DCL, then ALL your reps for the DFSQ,\nthen ALL your reps for the DMP BEFORE you put the KBs\ndown to rest.\n- Perform 3 reps per exercise\n- Perform as many complexes as possible in 15 minutes\n- Rest as needed between sets (1 complex = 1 set)", "full": "Hey!\nHope you’re feeling great after that killer 10 minute\nDouble Swing Test.\nFor the next 4 weeks it’s time for something different -\nIt’s time to go HARD CORE.\nIt’s time to visit double KB complexes.\nIn case you don’t know or have forgotten, a Complex\nis a series of exercises performed sequentially without\never putting the KBs down.\nAnd yes, they’re brutal. :-)\nThey make you strong.\nThey make you superbly conditioned.\nAnd they happen to also strip fat off you like a blowtorch\non butter.\nSo here’s our first one -\nWOD #221:\nDSW + DCL + DFSQ + DMP\n- Use a pair of KBs you can press 8-10 times, with relative ease\n- Remember, perform ALL your reps for the DSW, then ALL\nyour reps for the DCL, then ALL your reps for the DFSQ,\nthen ALL your reps for the DMP BEFORE you put the KBs\ndown to rest.\n- Perform 3 reps per exercise\n- Perform as many complexes as possible in 15 minutes\n- Rest as needed between sets (1 complex = 1 set)\n\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A1. Segmental Roll x 5 each quadrant\nA2. Get Up x 1,1, slow and light\nA3. SLDL x 2,2, light\n- Set your timer for 15 minutes\n- Perform A1 through A3 as a strength circuit\n- Use a LIGHT KB\n- Rest as necessary\n- Go by feel and don’t count your sets", "full": "Hey!\nComplexes, when performed correctly (like we are), are\nvery challenging to recover from.\nIn most of my programs I recommend taking days off between\nworkouts.\nHowever, part of the success of the Kettlebell W.O.D. is\nthe consistency aspect.\nTherefore, between Complex Workouts, you’ll perform\nvery light, very easy, active recovery KB workouts.\nRead that again:\nVery LIGHT.\nVery EASY .\nIf you choose to ignore this and “push” these workouts, you\nwill get crushed over then next 4 weeks.\nSo don’t do that.\nBe good to yourself.\nHere’s today’s LIGHT workout:\nWOD #222:\nA1. Segmental Roll x 5 each quadrant\nA2. Get Up x 1,1, slow and light\nA3. SLDL x 2,2, light\n- Set your timer for 15 minutes\n- Perform A1 through A3 as a strength circuit\n- Use a LIGHT KB\n- Rest as necessary\n- Go by feel and don’t count your sets\n\nEnjoy!\nGeoff", "minutes": 15}, {"main": "DSN + DMP + DSW\n- Use a pair of KBs you can press 8-10 times, with relative ease\n- Remember, perform ALL your reps for the DSN, then ALL\nyour reps for the DMP , then ALL your reps for the DSW,\nBEFORE you put the KBs down to rest.\n- Perform 3 reps per exercise\n- Perform as many complexes as possible in 15 minutes\n- Rest as needed between sets (1 complex = 1 set)", "full": "Yo!\nHowzit today?\nBet you’re feeling that first complex workout.\nGood.\nMore today.\nToday is considered a “light” complex.\nHere it is:\nWOD #223:\nDSN + DMP + DSW\n- Use a pair of KBs you can press 8-10 times, with relative ease\n- Remember, perform ALL your reps for the DSN, then ALL\nyour reps for the DMP , then ALL your reps for the DSW,\nBEFORE you put the KBs down to rest.\n- Perform 3 reps per exercise\n- Perform as many complexes as possible in 15 minutes\n- Rest as needed between sets (1 complex = 1 set)\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A1. Segmental Roll x 5 each quadrant\nA2. Get Up x 1,1, slow and light\nA3. SLDL x 2,2, light\n- Set your timer for 15 minutes\n- Perform A1 through A3 as a strength circuit\n- Use a LIGHT KB\n- Rest as necessary\n- Go by feel and don’t count your sets", "full": "Hey!\nHope you’re feeling GREAT today!\nTime for another Active Recovery workout.\nRemember, these are LIGHT.\nSay it with me - L-I-G-H-T... LIGHT!\nWOD #224:\nA1. Segmental Roll x 5 each quadrant\nA2. Get Up x 1,1, slow and light\nA3. SLDL x 2,2, light\n- Set your timer for 15 minutes\n- Perform A1 through A3 as a strength circuit\n- Use a LIGHT KB\n- Rest as necessary\n- Go by feel and don’t count your sets\nEnjoy!\nGeoff", "minutes": 15}, {"main": "DFSQ + DMP + DCL + DFSQ + DPP\n- Use a pair of KBs you can press 8-10 times, with relative ease\n- Remember, perform ALL your reps for the DFSQ, then ALL\nyour reps for the DMP , then ALL your reps for the DCL, then\nALL your reps of the DFSQ, then ALL your reps for the DPP\nBEFORE you put the KBs down to rest.\n- Perform 3 reps per exercise\n- Perform as many complexes as possible in 15 minutes\n- Rest as needed between sets (1 complex = 1 set)", "full": "Hey, hey, hey!\nHope you’re ready for today’s workout - it’s a TOUGH\none!\nIt’s our “heavy” complex day.\nHere’s what it looks like...\nWOD #225:\nDFSQ + DMP + DCL + DFSQ + DPP\n- Use a pair of KBs you can press 8-10 times, with relative ease\n- Remember, perform ALL your reps for the DFSQ, then ALL\nyour reps for the DMP , then ALL your reps for the DCL, then\nALL your reps of the DFSQ, then ALL your reps for the DPP\nBEFORE you put the KBs down to rest.\n- Perform 3 reps per exercise\n- Perform as many complexes as possible in 15 minutes\n- Rest as needed between sets (1 complex = 1 set)\nEnjoy!\nGeoff", "minutes": 15}, {"main": "DSW + DCL + DFSQ + DMP\n- Use a pair of KBs you can press 8-10 times, with relative ease\n- Remember, perform AL joy!\nGeoff", "minutes": 15}, {"main": "DFSQ + DMP + DCL + DFSQ + DPP\n- Use a pair of KBs you can press 8-10 times, with relative ease\n- Remember, perform ALL your reps for the DFSQ, then ALL\nyour reps for the DMP , then ALL your reps for the DCL, then\nALL your reps of the DFSQ, then ALL your reps for the DPP\nBEFORE you put the KBs down to rest.\n- Perform 3 reps per exercise\n- Perform as many complexes as possible in 15 minutes\n- Rest as needed between sets (1 complex = 1 set)\n- Go as hard as you can. You should be able to get one more\ncomplex than you did in WOD #225", "full": "Hey, hey!\nGOOD NEWS!\nNo Snatch or Swing Test today!\nBAD NEWS...\nYou should go as hard as you can today with your “heavy”\ncomplex.\nSeriously.\nWhy?\nBecause just like the rest of the week, we’re dropping the reps\nback down, which means you should really be able to push it,\nknock it out of the park, whatever you call your max effort level.\nWOD #240:\nDFSQ + DMP + DCL + DFSQ + DPP\n- Use a pair of KBs you can press 8-10 times, with relative ease\n- Remember, perform ALL your reps for the DFSQ, then ALL\nyour reps for the DMP , then ALL your reps for the DCL, then\nALL your reps of the DFSQ, then ALL your reps for the DPP\nBEFORE you put the KBs down to rest.\n- Perform 3 reps per exercise\n- Perform as many complexes as possible in 15 minutes\n- Rest as needed between sets (1 complex = 1 set)\n- Go as hard as you can. You should be able to get one more\ncomplex than you did in WOD #225\nEnjoy!\nGeoff", "minutes": 15}, {"main": "DCL + DFSQ + DSN + DMP\n- Use a pair of KBs you can press 8-10 times, with relative ease\n- Remember, perform ALL your reps for the DCL, then ALL\nyour reps for the DFSQ, then ALL your reps for the DSN,\nthen ALL your reps for the DMP BEFORE you put the KBs\ndown to rest.\n- Perform 5 reps per exercise\n- Perform as many complexes as possible in 15 minutes\n- Rest as needed between sets (1 complex = 1 set)", "full": "Yo...\nNo rest for the weary here.\nFor the next 4 weeks, we’re going to do some “advanced”\nstrength and conditioning work with your KBs.\nWe have a good mix of double and single KB work.\nAnd we’re going to push into the realm of higher rep\nKB work, which has an unbelievably transformative\neffect on your body.\nToday, we’re going to re-load our complexes for one\nworkout a week.\nWOD #241:\nDCL + DFSQ + DSN + DMP\n- Use a pair of KBs you can press 8-10 times, with relative ease\n- Remember, perform ALL your reps for the DCL, then ALL\nyour reps for the DFSQ, then ALL your reps for the DSN,\nthen ALL your reps for the DMP BEFORE you put the KBs\ndown to rest.\n- Perform 5 reps per exercise\n- Perform as many complexes as possible in 15 minutes\n- Rest as needed between sets (1 complex = 1 set)\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A1. Segmental Roll x 5 each quadrant\nA2. Get Up x 1,1, slow and light\nA3. SLDL x 2,2, light\n- Set your timer for 15 minutes\n- Perform A1 through A3 as a strength circuit\n- Use a LIGHT KB\n- Rest as necessary\n- Go by feel and don’t count your sets", "full": "Hey!\nJust like the previous 4 weeks, 2 days a week are going to\nbe Active Recovery days.\nWhy?\nREMEMBER: It’s NOT how much work you can do. It’s how\nmuch work you can RECOVER from that determines your\nresults.\nSo let’s keep the good times going and use our “usual\nsuspects” for our Active Recovery workouts.\nWOD #242:\nA1. Segmental Roll x 5 each quadrant\nA2. Get Up x 1,1, slow and light\nA3. SLDL x 2,2, light\n- Set your timer for 15 minutes\n- Perform A1 through A3 as a strength circuit\n- Use a LIGHT KB\n- Rest as necessary\n- Go by feel and don’t count your sets\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A1. DCL x 10\nA2. DPP x 10\n- Use a pair of KBs you can press 8-10 times, with relative ease\n- Perform ONE DCL followed immediately by one DPP - one\nalternated with the other, until the total number of reps have\nbeen reached. (DCL + DPP + DCL + DPP + ...)\n- Perform as many sets as possible in 15 minutes\n- Rest as needed between sets", "full": "Something completely different, today!\nOne of the best things about KB training is the high-rep\nballistics.\nThey make you wiry strong and rip the fat right from your\nbody.\nPlus, when done enough, you practically implant a third\nlung into yourself - you have that much conditioning.\nSo today, we’re starting our high rep double KB ballistics.\nThere’s no other workout like them.\nHere we go!\nWOD #243:\nA1. DCL x 10\nA2. DPP x 10\n- Use a pair of KBs you can press 8-10 times, with relative ease\n- Perform ONE DCL followed immediately by one DPP - one\nalternated with the other, until the total number of reps have\nbeen reached. (DCL + DPP + DCL + DPP + ...)\n- Perform as many sets as possible in 15 minutes\n- Rest as needed between sets\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A1. Segmental Roll x 5 each quadrant\nA2. Get Up x 1,1, slow and light\nA3. SLDL x 2,2, light\n- Set your timer for 15 minutes\n- Perform A1 through A3 as a strength circuit\n- Use a LIGHT KB\n- Rest as necessary\n- Go by feel and don’t count your sets", "full": "Active Recovery Day again...\nWOD #244:\nA1. Segmental Roll x 5 each quadrant\nA2. Get Up x 1,1, slow and light\nA3. SLDL x 2,2, light\n- Set your timer for 15 minutes\n- Perform A1 through A3 as a strength circuit\n- Use a LIGHT KB\n- Rest as necessary\n- Go by feel and don’t count your sets\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A. Snatch x 15,15\n- If possible, use a Snatch Test size KB (24kg for Men, 16kg\nfor Women)\n- Do not rest between hands (Switch with no rest between sides)\n- Perform as many sets as possible in 15 minutes\n- Rest as needed between sets", "full": "¡Que Pasa!\nOne thing we haven’t done yet is explore why the single KB\nSnatch is called the Tsar, or “King” of the KB lifts.\nWe’ll start today.\nWe’ve played with the Snatch A LOT over the past 11 months.\nBut one thing we’ve never done is really pushed it for reps.\nWhen you do, that’s when you discover the true power of\nthe Snatch.\nSo, without further ado...\nWOD #245:\nA. Snatch x 15,15\n- If possible, use a Snatch Test size KB (24kg for Men, 16kg\nfor Women)\n- Do not rest between hands (Switch with no rest between sides)\n- Perform as many sets as possible in 15 minutes\n- Rest as needed between sets\nEnjoy!\nGeoff", "minutes": 15}, {"main": "DCL + DFSQ + DSN + DMP\n- Use a pair of KBs you can press 8-10 times, with relative ease\n- Remember, perform ALL your reps for the DCL, then ALL\nyour reps for the DFSQ, then ALL your reps for the DSN,\nthen ALL your reps for the DMP BEFORE you put the KBs\ndown to rest.\n- Perform 6 reps per exercise\n- Perform as many complexes as possible in 15 minutes\n- Rest as needed between sets (1 complex = 1 set)", "full": "Yo...\nBack to our Complexes... Adding a rep to each exercise\ntoday.\nSee below.\nWOD #246:\nDCL + DFSQ + DSN + DMP\n- Use a pair of KBs you can press 8-10 times, with relative ease\n- Remember, perform ALL your reps for the DCL, then ALL\nyour reps for the DFSQ, then ALL your reps for the DSN,\nthen ALL your reps for the DMP BEFORE you put the KBs\ndown to rest.\n- Perform 6 reps per exercise\n- Perform as many complexes as possible in 15 minutes\n- Rest as needed between sets (1 complex = 1 set)\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A1. Segmental Roll x 5 each quadrant\nA2. Get Up x 1,1, slow and light\nA3. SLDL x 2,2, light\n- Set your timer for 15 minutes\n- Perform A1 through A3 as a strength circuit\n- Use a LIGHT KB\n- Rest as necessary\n- Go by feel and don’t count your sets", "full": "Hey!\nMore.\nActive.\nRecovery.\nToday.\n:-)\nWOD #247:\nA1. Segmental Roll x 5 each quadrant\nA2. Get Up x 1,1, slow and light\nA3. SLDL x 2,2, light\n- Set your timer for 15 minutes\n- Perform A1 through A3 as a strength circuit\n- Use a LIGHT KB\n- Rest as necessary\n- Go by feel and don’t count your sets\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A1. DCL x 12\nA2. DPP x 12\n- Use a pair of KBs you can p  Perform as many complexes as possible in 15 minutes\n- Rest as needed between sets (1 complex = 1 set)", "full": "Today is our Final Complex workout.\nGo as hard as you can.\nYou should be able to get at least one more round than you\ndid on WOD #241.\nWhy?\nCuz we dropped the reps back down!\nBOOM!\nWOD #256:\nDCL + DFSQ + DSN + DMP\n- Use a pair of KBs you can press 8-10 times, with relative ease\n- Remember, perform ALL your reps for the DCL, then ALL\nyour reps for the DFSQ, then ALL your reps for the DSN,\nthen ALL your reps for the DMP BEFORE you put the KBs\ndown to rest.\n- Perform 5 reps per exercise\n- Perform as many complexes as possible in 15 minutes\n- Rest as needed between sets (1 complex = 1 set)\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A1. Segmental Roll x 5 each quadrant\nA2. Get Up x 1,1, slow and light\nA3. SLDL x 2,2, light\n- Set your timer for 15 minutes\n- Perform A1 through A3 as a strength circuit\n- Use a LIGHT KB\n- Rest as necessary\n- Go by feel and don’t count your sets", "full": "Yo!\nYup, again...\nWOD #257:\nA1. Segmental Roll x 5 each quadrant\nA2. Get Up x 1,1, slow and light\nA3. SLDL x 2,2, light\n- Set your timer for 15 minutes\n- Perform A1 through A3 as a strength circuit\n- Use a LIGHT KB\n- Rest as necessary\n- Go by feel and don’t count your sets\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A1. DCL x 10\nA2. DPP x 10\n- Use a pair of KBs you can press 8-10 times, with relative ease\n- Perform ONE DCL followed immediately by one DPP - one\nalternated with the other, until the total number of reps have\nbeen reached. (DCL + DPP + DCL + DPP + ...)\n- Perform as many sets as possible in 15 minutes\n- Rest as needed between sets", "full": "Hey!\nFinal double Clean + Push Press workout.\nLike the complexes.. Go wild today!\nWOD #258:\nA1. DCL x 10\nA2. DPP x 10\n- Use a pair of KBs you can press 8-10 times, with relative ease\n- Perform ONE DCL followed immediately by one DPP - one\nalternated with the other, until the total number of reps have\nbeen reached. (DCL + DPP + DCL + DPP + ...)\n- Perform as many sets as possible in 15 minutes\n- Rest as needed between sets\nEnjoy!\nGeoff", "minutes": 15}, {"main": "A1. Segmental Roll x 5 each quadrant\nA2. Get Up x 1,1, slow and light\nA3. SLDL x 2,2, light\n- Set your timer for 15 minutes\n- Perform A1 through A3 as a strength circuit\n- Use a LIGHT KB\n- Rest as necessary\n- Go by feel and don’t count your sets", "full": "Finally... The Last Time...\nWOD #259:\nA1. Segmental Roll x 5 each quadrant\nA2. Get Up x 1,1, slow and light\nA3. SLDL x 2,2, light\n- Set your timer for 15 minutes\n- Perform A1 through A3 as a strength circuit\n- Use a LIGHT KB\n- Rest as necessary\n- Go by feel and don’t count your sets\nEnjoy!\nGeoff", "minutes": 15}, {"main": "5 Minute Snatch Test\nYou know how this is done.\nSo let’s get to it.\nWhen you’re finished, write down your results here: ______", "full": "BOOM!!!\n260!!!\nCONGRATULATIONS, !\nYou made it a whole year through the “Kettlebell W.O.D.”!\nFAN-FREAKIN-TASTIC!\nI hope you’re proud of yourself!\nLet’s finish strong today with one Final Test -\nWOD #260:\n5 Minute Snatch Test\nYou know how this is done.\nSo let’s get to it.\nWhen you’re finished, write down your results here: ______\nThen go back and look at your first Snatch Test and your very\nfirst Swing Test.\n.\n.\n.\n.\n.\nNow that you’re done, you might be wondering...\n“What do I do next? Are there more WOD’s?”\nUnfortunately, there are no more WOD’s.\nSo I recommend you head over to www.kettlebellworkouts.com\nand browse through the high quality kettlebell programs\nover there and grab one that looks the most interesting\n\nto you.\nThat’s it for me.\nI can say it’s been a privilege working with you over the\nlast year.\nStay STRONG!\nGeoff", "minutes": 5}]</script>
<script>
const $ = id => document.getElementById(id);
const workouts = JSON.parse($('data').textContent);
const key = 'personal-kettlebell-wod-v1';
const dateKey = () => {
  const now = new Date();
  return [now.getFullYear(),now.getMonth()+1,now.getDate()].join('-');
};
let state = {entries: [], draft: {}};
function storageError() {
  $('error').hidden = false;
  $('error').textContent = 'Deze browser kan je gegevens niet lokaal bewaren. Houd dit tabblad open om je voortgang te behouden.';
}
try {
  const saved = localStorage.getItem(key);
  if (saved) state = JSON.parse(saved);
} catch { storageError(); }
function save() {
  try { localStorage.setItem(key, JSON.stringify(state)); }
  catch { storageError(); }
}
let historyOpen = false;
let shownDay = dateKey();
let audio;
let notified = false;
const entryText = entry => entry.skipped ? 'Ontbreekt in het boek' : [
  entry.reps === '' ? '' : entry.reps + ' reps',
  entry.kg === '' ? '' : entry.kg + ' kg per kettlebell'
].filter(Boolean).join(' · ') || 'Geen reps of gewicht ingevuld';
function render() {
  shownDay = dateKey();
  const count = state.entries.length;
  const last = state.entries.at(-1);
  const finished = count === workouts.length;
  const locked = finished || last?.day === shownDay;
  $('training').hidden = historyOpen || locked;
  $('complete').hidden = historyOpen || !locked;
  $('history').hidden = !historyOpen;
  $('historyBtn').textContent = historyOpen ? 'Terug' : 'Logboek';
  $('count').textContent = state.entries.filter(entry => !entry.skipped).length + ' van 259 afgerond';
  $('progress').value = state.entries.filter(entry => !entry.skipped).length;
  if (historyOpen) {
    $('entries').replaceChildren(...(count ? [...state.entries].reverse().map(entry => {
      const item = document.createElement('li');
      item.textContent = 'WOD ' + entry.number + ' · ' + entryText(entry);
      return item;
    }) : [Object.assign(document.createElement('li'), {textContent:'Je hebt nog geen trainingen afgerond.'})]));
  } else if (locked) {
    $('doneWod').textContent = 'WOD ' + last.number + ' ✓';
    $('result').textContent = entryText(last);
    $('next').textContent = finished ? 'Je hebt alle 259 beschikbare trainingen afgerond.' : 'Morgen staat WOD ' + (count+1) + ' klaar.';
  } else {
    const wod = workouts[count];
    $('timer').hidden = Boolean(wod.missing);
    $('reps').parentElement.parentElement.hidden = Boolean(wod.missing);
    $('log').querySelector('h2').hidden = Boolean(wod.missing);
    $('finish').textContent = wod.missing ? 'Naar WOD 34' : 'Training afronden';
    $('title').textContent = 'WOD ' + (count+1);
    $('workout').textContent = wod.main;
    $('full').textContent = wod.full;
    $('extra').hidden = wod.main === wod.full;
    $('minutes').value = state.draft.minutes ?? wod.minutes;
    $('reps').value = state.draft.reps ?? '';
    $('kg').value = state.draft.kg ?? '';
  }
}
function elapsed() {
  const draft = state.draft;
  return (draft.elapsed || 0) + (draft.started ? Math.max(0, Date.now()-draft.started) : 0);
}
function tick() {
  if (shownDay !== dateKey()) render();
  if ($('training').hidden || $('timer').hidden) return;
  const draft = state.draft;
  const limit = Number($('minutes').value)*60000;
  const time = elapsed();
  const ended = limit > 0 && time >= limit;
  if (ended && draft.started) {
    draft.started = null;
    draft.elapsed = limit;
    save();
  }
  if (ended && !notified && audio?.state === 'running') {
    const tone = audio.createOscillator();
    const volume = audio.createGain();
    volume.gain.value = 0.12;
    tone.frequency.value = 660;
    tone.connect(volume).connect(audio.destination);
    tone.start();
    tone.stop(audio.currentTime + 0.45);
    notified = true;
  }
  const seconds = limit ? Math.ceil(Math.max(0,limit-time)/1000) : Math.floor(time/1000);
  $('clock').textContent = [Math.floor(seconds/60),seconds%60].map(n => String(n).padStart(2,'0')).join(':');
  $('signal').textContent = ended ? 'Tijd om' : '';
  $('start').textContent = draft.started ? 'Pauze' : time && !ended ? 'Verder' : 'Start';
  $('minutes').disabled = Boolean(draft.started);
}
$('start').onclick = () => {
  const draft = state.draft;
  if (draft.started) {
    draft.elapsed = elapsed();
    draft.started = null;
  } else {
    try { audio ??= new AudioContext(); audio.resume().catch(()=>{}); } catch {}
    const limit = Number($('minutes').value)*60000;
    if (limit && elapsed() >= limit) draft.elapsed = 0;
    draft.started = Date.now();
    notified = false;
  }
  save(); tick();
};
function resetTimer() {
  state.draft.started = null;
  state.draft.elapsed = 0;
  notified = false;
  save(); tick();
}
$('reset').onclick = resetTimer;
for (const id of ['minutes','reps','kg']) {
  $(id).oninput = () => {
    if (!$(id).validity.valid) return;
    state.draft[id] = $(id).value;
    if (id === 'minutes') resetTimer();
    else save();
  };
}
$('log').onsubmit = event => {
  event.preventDefault();
  if (state.entries.length >= workouts.length || state.entries.at(-1)?.day === dateKey()) return;
  state.entries.push({number:state.entries.length+1, day:workouts[state.entries.length].missing ? '' : dateKey(), skipped:Boolean(workouts[state.entries.length].missing), reps:$('reps').value, kg:$('kg').value});
  state.draft = {};
  save(); render(); window.scrollTo(0,0);
};
$('historyBtn').onclick = () => { historyOpen = !historyOpen; render(); tick(); };
render(); tick(); setInterval(tick,250);
</script></html>
